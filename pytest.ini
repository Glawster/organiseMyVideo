[tool:pytest]
testpaths = tests
python_functions = test*
python_classes = Test*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# OMP-MANAGED-BEGIN
python_files = test_[a-z]*.py
# OMP-MANAGED-END
